<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Fretboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<table>

    <thead>
        <tr>
            <th></th>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
            <th>8</th>
            <th>9</th>
            <th>10</th>
            <th>11</th>
            <th>12</th>
        </tr>
    </thead>


    <!-- Reminder: -->
    <!-- 3 types of class: Fret = Fret biasa, Fret marker = frets yang ada dots, String label = labels for each string -->
    <!-- data-string = which string? -->
    <!-- data-fret = which fret? -->

    <tbody>
        <tr>
            <td class="string-label" data-string="1" 
                data-fret="0">E</td>
            <td class="fret" data-string="1" 
                data-fret="1"></td>
            <td class="fret" data-string="1" 
                data-fret="2"></td>
            <td class="fret marker" data-string="1" 
                data-fret="3">●</td>
            <td class="fret" data-string="1" 
                data-fret="4"></td>
            <td class="fret marker" data-string="1" 
                data-fret="5">●</td>
            <td class="fret" data-string="1" 
                data-fret="6"></td>
            <td class="fret marker" data-string="1" 
                data-fret="7">●</td>
            <td class="fret" data-string="1" 
                data-fret="8"></td>
            <td class="fret marker" data-string="1" 
                data-fret="9">●</td>
            <td class="fret" data-string="1" 
                data-fret="10"></td>
            <td class="fret" data-string="1" 
            data-fret="11"></td>
            <td class="fret" data-string="1" 
            data-fret="12">
                <div class="double-marker">
                    <span>●</span>
                    <span>●</span>
                </div>
            </td>
        </tr>

        <tr>
            <td class="string-label" data-string="2" 
                data-fret="0">B</td>

                </div>
            </td>
        </tr>
    </tbody>
</table>

<div class="controls">

    <!-- Toggle -->
    <div class="control-group">
        <label>
            <input
                type="checkbox"
                id="show-notes-toggle"
            >
            Show Notes on Fretboard
        </label>
    </div>

    <!-- Tuning -->
    <div class="control-group">
        <label for="tuning-select">Tuning</label>

        <select id="tuning-select">
            <option>Loading...</option>
        </select>
    </div>

    <!-- Root Note + Scale -->
    <div class="control-row">

        <div class="control-group">
            <label for="root-note-select">Root Note</label>

            <select id="root-note-select">
                <option>Loading...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="scale-select">Scale</label>

            <select id="scale-select">
                <option>Loading...</option>
            </select>
        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
