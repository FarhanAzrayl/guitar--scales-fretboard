<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Fretboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<table>

    <thead>
        <tr>
            <th></th>
            <th>1</th>

    <!-- Reminder: -->
    <!-- 3 types of class: Fret = Fret biasa, Fret marker = frets yang ada dots, String label = labels for each string -->
    <!-- data-string = which string? -->
    <!-- data-fret = which fret? -->
    <!-- We are changing fret 0 to a drop down so that each string is editable for custom tunings. Notes are loaded from const NOTES from app.js -->

    <tbody>
        <tr>
            <td class="string-label" data-string="1" 
                data-fret="0">
                <select class="open-string-select" data-string="1"></select>
            </td>
            <td class="fret" data-string="1" 
                data-fret="1"></td>
            <td class="fret" data-string="1" 
                data-fret="2"></td>
            <td class="fret marker" data-string="1" 
                data-fret="3">●</td>
            <td class="fret" data-string="1" 
                data-fret="4"></td>
            <td class="fret marker" data-string="1" 
                data-fret="5">●</td>
            <td class="fret" data-string="1"

                data-fret="8"></td>

                data-fret="9">●</td>
            <td class="fret" data-string="1" 
                data-fret="10"></td>
            <td class="fret" data-string="1" 
            data-fret="11"></td>
            <td class="fret" data-string="1" 
            data-fret="12">
                <div class="double-marker">
                    <span>●</span>
                    <span>●</span>
                </div>
            </td>
        </tr>

        <tr>

            <td class="fret marker" data-string="2"

</table>

<div class="controls">

    <!-- Toggle the notes on and off -->
    <div class="control-group">

        <label class="toggle">

            <input
                type="checkbox"
                id="show-notes-toggle"
            >
        <span class="slider"></span>
        </label>

    <span>Show Notes on Fretboard</span>

    </div>

    <!-- Tuning -->
    <div class="control-group">
        <label for="tuning-select">Tuning</label>

        <select id="tuning-select">
            <option>Loading...</option>
        </select>
    </div>

    <!-- Root Note + Scale -->
    <div class="control-row">

        <div class="control-group">
            <label for="root-note-select">Root Note</label>

            <select id="root-note-select">
                <option>Loading...</option>
            </select>
        </div>

        <div class="control-group">
            <label for="scale-select">Scale</label>

            <select id="scale-select">
                <option>Loading...</option>
            </select>
        </div>

    </div>

    <!-- Toggle the highlights on and off -->
    <div class="control-group">

    <label class="toggle">
        <input
            type="checkbox"
            id="highlight-scales-toggle"
        >
        <span class="slider"></span>
    </label>

    <span>Highlight Scales</span>

    <input
        type="color"
        id="highlight-color"
        value="#ffd54f"
        title="Choose highlight colour"
    >

</div>



</div>

<script src="app.js"></script>

</body>
</html>
